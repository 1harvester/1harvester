<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100" role="img" aria-label="Figma: Design Tool">
  <title>Figma</title>
  <desc>Design Tool</desc>
  <defs>
    <!-- Subtle manga screentone pattern -->
    <pattern id="screentone-figma" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.65" fill="#8c959f"/>
    </pattern>
    <clipPath id="card-clip-figma">
      <rect x="1" y="1" width="298" height="98" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <!-- Card Base (White against dark mode) -->
  <rect x="1" y="1" width="298" height="98" rx="10" ry="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Manga screentone corner panel (subtle texture) -->
  <g clip-path="url(#card-clip-figma)">
    <path d="M 235,1 L 299,1 L 299,42 Z" fill="url(#screentone-figma)" opacity="0.35"/>
    <!-- Fine manga panel accent line -->
    <line x1="235" y1="1" x2="299" y2="42" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Manga decorative mark (minimalist sparkle / registration mark) -->
  <path d="M 276,14 C 276,17.5 273.5,19 270,19 C 273.5,19 276,20.5 276,24 C 276,20.5 278.5,19 282,19 C 278.5,19 276,17.5 276,14 Z" fill="#6e7781"/>
  <circle cx="282.5" cy="13.5" r="0.8" fill="#8c959f"/>

  <!-- Left: Icon Frame with manga border & screentone backing -->
  <g transform="translate(16, 16)">
    <!-- Icon box -->
    <rect x="0" y="0" width="68" height="68" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <!-- Subtle screentone accent in icon box -->
    <rect x="1" y="1" width="66" height="66" rx="7" fill="url(#screentone-figma)" opacity="0.15"/>
    <!-- Manga corner bracket accents on icon frame -->
    <path d="M 0,10 L 0,0 L 10,0" fill="none" stroke="#24292f" stroke-width="1.5"/>
    <path d="M 68,58 L 68,68 L 58,68" fill="none" stroke="#24292f" stroke-width="1.5"/>
    <!-- Vector Icon centered -->
    <g transform="translate(15, 13) scale(0.31)">
      <g>
        <path fill="#0ACF83" d="M45.5 129c11.9 0 21.5-9.6 21.5-21.5V86H45.5C33.6 86 24 95.6 24 107.5S33.6 129 45.5 129z"/>
        <path fill="#A259FF" d="M24 64.5C24 52.6 33.6 43 45.5 43H67v43H45.5C33.6 86 24 76.4 24 64.5z"/>
        <path fill="#F24E1E" d="M24 21.5C24 9.6 33.6 0 45.5 0H67v43H45.5C33.6 43 24 33.4 24 21.5z"/>
        <path fill="#FF7262" d="M67 0h21.5C100.4 0 110 9.6 110 21.5S100.4 43 88.5 43H67z"/>
        <path fill="#1ABCFE" d="M110 64.5c0 11.9-9.6 21.5-21.5 21.5S67 76.4 67 64.5 76.6 43 88.5 43 110 52.6 110 64.5z"/>
      </g>
    </g>
  </g>

  <!-- Right: Typography & Meta -->
  <g transform="translate(98, 0)">
    <!-- Tech Name -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#24292f" letter-spacing="-0.3">Figma</text>
    
    <!-- Fine manga divider line -->
    <line x1="0" y1="53" x2="182" y2="53" stroke="#eaeef2" stroke-width="1"/>

    <!-- Category / Description -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#57606a" letter-spacing="0.2">Design Tool</text>

    <!-- Subtle manga speed ticks in lower right -->
    <line x1="166" y1="82" x2="171" y2="73" stroke="#d0d7de" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="172" y1="82" x2="177" y2="73" stroke="#d0d7de" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="178" y1="82" x2="183" y2="73" stroke="#d0d7de" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
