<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100" role="img" aria-label="Express.js: Node.js Framework">
  <title>Express.js</title>
  <desc>Node.js Framework</desc>
  <defs>
    <!-- Subtle manga screentone pattern -->
    <pattern id="screentone-expressjs" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.65" fill="#8c959f"/>
    </pattern>
    <clipPath id="card-clip-expressjs">
      <rect x="1" y="1" width="298" height="98" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <!-- Card Base (White against dark mode) -->
  <rect x="1" y="1" width="298" height="98" rx="10" ry="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Manga screentone corner panel (subtle texture) -->
  <g clip-path="url(#card-clip-expressjs)">
    <path d="M 235,1 L 299,1 L 299,42 Z" fill="url(#screentone-expressjs)" opacity="0.35"/>
    <!-- Fine manga panel accent line -->
    <line x1="235" y1="1" x2="299" y2="42" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Manga decorative mark (minimalist sparkle / registration mark) -->
  <path d="M 276,14 C 276,17.5 273.5,19 270,19 C 273.5,19 276,20.5 276,24 C 276,20.5 278.5,19 282,19 C 278.5,19 276,17.5 276,14 Z" fill="#6e7781"/>
  <circle cx="282.5" cy="13.5" r="0.8" fill="#8c959f"/>

  <!-- Left: Icon Frame with manga border & screentone backing -->
  <g transform="translate(16, 16)">
    <!-- Icon box -->
    <rect x="0" y="0" width="68" height="68" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <!-- Subtle screentone accent in icon box -->
    <rect x="1" y="1" width="66" height="66" rx="7" fill="url(#screentone-expressjs)" opacity="0.15"/>
    <!-- Manga corner bracket accents on icon frame -->
    <path d="M 0,10 L 0,0 L 10,0" fill="none" stroke="#24292f" stroke-width="1.5"/>
    <path d="M 68,58 L 68,68 L 58,68" fill="none" stroke="#24292f" stroke-width="1.5"/>
    <!-- Vector Icon centered -->
    <g transform="translate(13.5, 13.5) scale(0.32)">
      <path fill="#000000" d="M126.67 98.44c-4.56 1.16-7.38.05-9.91-3.75-5.68-8.51-11.95-16.63-18-24.9-.78-1.07-1.59-2.12-2.6-3.45C89 76 81.85 85.2 75.14 94.77c-2.4 3.42-4.92 4.91-9.4 3.7l26.92-36.13L67.6 29.71c4.31-.84 7.29-.41 9.93 3.45 5.83 8.52 12.26 16.63 18.67 25.21 6.45-8.55 12.8-16.67 18.8-25.11 2.41-3.42 5-4.72 9.33-3.46-3.28 4.35-6.49 8.63-9.72 12.88-4.36 5.73-8.64 11.53-13.16 17.14-1.61 2-1.35 3.3.09 5.19C109.9 76 118.16 87.1 126.67 98.44zM1.33 61.74c.72-3.61 1.2-7.29 2.2-10.83 6-21.43 30.6-30.34 47.5-17.06C60.93 41.64 63.39 52.62 62.9 65H7.1c-.84 22.21 15.15 35.62 35.53 28.78 7.15-2.4 11.36-8 13.47-15 1.07-3.51 2.84-4.06 6.14-3.06-1.69 8.76-5.52 16.08-13.52 20.66-12 6.86-29.13 4.64-38.14-4.89C5.26 85.89 3 78.92 2 71.39c-.15-1.2-.46-2.38-.7-3.57q.03-3.04.03-6.08zm5.87-1.49h50.43c-.33-16.06-10.33-27.47-24-27.57-15-.12-25.78 11.02-26.43 27.57z"/>
    </g>
  </g>

  <!-- Right: Typography & Meta -->
  <g transform="translate(98, 0)">
    <!-- Tech Name -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#24292f" letter-spacing="-0.3">Express.js</text>
    
    <!-- Fine manga divider line -->
    <line x1="0" y1="53" x2="182" y2="53" stroke="#eaeef2" stroke-width="1"/>

    <!-- Category / Description -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#57606a" letter-spacing="0.2">Node.js Framework</text>

    <!-- Subtle manga speed ticks in lower right -->
    <line x1="166" y1="82" x2="171" y2="73" stroke="#d0d7de" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="172" y1="82" x2="177" y2="73" stroke="#d0d7de" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="178" y1="82" x2="183" y2="73" stroke="#d0d7de" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
