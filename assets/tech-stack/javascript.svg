<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100" role="img" aria-label="JavaScript: Programming Language">
  <title>JavaScript</title>
  <desc>Programming Language</desc>
  <defs>
    <!-- Subtle manga screentone pattern -->
    <pattern id="screentone-javascript" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.65" fill="#8c959f"/>
    </pattern>
    <clipPath id="card-clip-javascript">
      <rect x="1" y="1" width="298" height="98" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <!-- Card Base (White against dark mode) -->
  <rect x="1" y="1" width="298" height="98" rx="10" ry="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Manga screentone corner panel (subtle texture) -->
  <g clip-path="url(#card-clip-javascript)">
    <path d="M 235,1 L 299,1 L 299,42 Z" fill="url(#screentone-javascript)" opacity="0.35"/>
    <!-- Fine manga panel accent line -->
    <line x1="235" y1="1" x2="299" y2="42" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Manga decorative mark (minimalist sparkle / registration mark) -->
  <path d="M 276,14 C 276,17.5 273.5,19 270,19 C 273.5,19 276,20.5 276,24 C 276,20.5 278.5,19 282,19 C 278.5,19 276,17.5 276,14 Z" fill="#6e7781"/>
  <circle cx="282.5" cy="13.5" r="0.8" fill="#8c959f"/>

  <!-- Left: Icon Frame with manga border & screentone backing -->
  <g transform="translate(16, 16)">
    <!-- Icon box -->
    <rect x="0" y="0" width="68" height="68" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <!-- Subtle screentone accent in icon box -->
    <rect x="1" y="1" width="66" height="66" rx="7" fill="url(#screentone-javascript)" opacity="0.15"/>
    <!-- Manga corner bracket accents on icon frame -->
    <path d="M 0,10 L 0,0 L 10,0" fill="none" stroke="#24292f" stroke-width="1.5"/>
    <path d="M 68,58 L 68,68 L 58,68" fill="none" stroke="#24292f" stroke-width="1.5"/>
    <!-- Vector Icon centered -->
    <g transform="translate(14, 14) scale(1.6667)">
      <rect width="24" height="24" rx="2" fill="#F7DF1E"/>
      <path fill="#000000" d="M22.034 18.276c-.175-1.095-.888-2.015-3.003-2.873-.736-.345-1.554-.585-1.797-1.14-.091-.33-.105-.51-.046-.705.15-.646.915-.84 1.515-.66.39.12.75.42.976.9 1.034-.676 1.034-.676 1.755-1.125-.27-.42-.404-.601-.586-.78-.63-.705-1.469-1.065-2.834-1.034l-.705.089c-.676.165-1.32.525-1.71 1.005-1.14 1.291-.811 3.541.569 4.471 1.365 1.02 3.361 1.244 3.616 2.205.24 1.17-.87 1.545-1.966 1.41-.811-.18-1.26-.586-1.755-1.336l-1.83 1.051c.21.48.45.689.81 1.109 1.74 1.756 6.09 1.666 6.871-1.004.029-.09.24-.705.074-1.65l.046.067zm-8.983-7.245h-2.248c0 1.938-.009 3.864-.009 5.805 0 1.232.063 2.363-.138 2.711-.33.689-1.18.601-1.566.48-.396-.196-.597-.466-.83-.855-.063-.105-.11-.196-.127-.196l-1.825 1.125c.305.63.75 1.172 1.324 1.517.855.51 2.004.675 3.207.405.783-.226 1.458-.691 1.811-1.411.51-.93.402-2.07.397-3.346.012-2.054 0-4.109 0-6.179l.004-.056z"/>
    </g>
  </g>

  <!-- Right: Typography & Meta -->
  <g transform="translate(98, 0)">
    <!-- Tech Name -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#24292f" letter-spacing="-0.3">JavaScript</text>
    
    <!-- Fine manga divider line -->
    <line x1="0" y1="53" x2="182" y2="53" stroke="#eaeef2" stroke-width="1"/>

    <!-- Category / Description -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#57606a" letter-spacing="0.2">Programming Language</text>

    <!-- Subtle manga speed ticks in lower right -->
    <line x1="166" y1="82" x2="171" y2="73" stroke="#d0d7de" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="172" y1="82" x2="177" y2="73" stroke="#d0d7de" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="178" y1="82" x2="183" y2="73" stroke="#d0d7de" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
